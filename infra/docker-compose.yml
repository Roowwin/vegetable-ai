# ============================================
# VeggieOps AI — Docker Compose
# ============================================

services:

  db:
    image: postgres:16-alpine
    container_name: veggie-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - veggie_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veggie-net

  adminer:
    image: adminer:latest
    container_name: veggie-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      db:
        condition: service_healthy
    networks:
      - veggie-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: veggie-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: development
    volumes:
      - ../backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - veggie-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: veggie-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
    volumes:
      - ../frontend/app:/app/app
      - ../frontend/package.json:/app/package.json
      - ../frontend/next.config.js:/app/next.config.js
      - ../frontend/tsconfig.json:/app/tsconfig.json
    depends_on:
      - backend
    networks:
      - veggie-net

volumes:
  veggie_postgres_data:
    name: veggie_postgres_data

networks:
  veggie-net:
    name: veggie-net
    driver: bridge
